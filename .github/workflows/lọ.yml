name: 🚀 RDP FREE - SERVEO TUNNEL
on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '5h40m'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h40m'

jobs:
  RDP-Free-Serveo:
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - name: 🔐 KHỞI ĐỘNG RDP SERVER
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          Start-Service -Name TermService -ErrorAction SilentlyContinue
          Set-Service -Name TermService -StartupType Automatic
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RDP Allow" -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $s = (Get-Service -Name TermService).Status
          Write-Host "✅ RDP Status: $s" -ForegroundColor Green

      - name: 🌐 KHỞI ĐỘNG SERVEO TUNNEL
        run: |
          Write-Host "🌐 Ket noi Serveo..." -ForegroundColor Yellow

          # Serveo yeu cau flag -N (no remote command) va -T (no pseudo-tty)
          # Port 0 KHONG duoc ho tro cho TCP - phai dung port cu the
          # Thu nhieu port khac nhau de tranh port bi chiem
          $portList = @(13389, 23389, 33389, 43389, 53389, 33899, 44389, 55389, 10001, 20001)

          $sshDir = "$env:USERPROFILE\.ssh"
          if (-not (Test-Path $sshDir)) { New-Item -Path $sshDir -ItemType Directory -Force | Out-Null }

          $domain = ""
          $successPort = 0

          foreach ($port in $portList) {
            Write-Host ""
            Write-Host "🔄 Thu port serveo.net:$port ..." -ForegroundColor Cyan

            # Kill SSH cu neu co
            Stop-Process -Name "ssh" -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1

            # Tao process voi output capture realtime
            $pinfo = New-Object System.Diagnostics.ProcessStartInfo
            $pinfo.FileName   = "ssh"
            # -N  : khong chay remote command (bat buoc cho tunnel)
            # -T  : tat pseudo-terminal (tranh warning)
            # -R  : remote forward PORT:localhost:3389
            $pinfo.Arguments  = "-NT -R ${port}:localhost:3389 serveo.net -oStrictHostKeyChecking=no -oServerAliveInterval=30 -oConnectTimeout=15"
            $pinfo.RedirectStandardOutput = $true
            $pinfo.RedirectStandardError  = $true
            $pinfo.UseShellExecute = $false
            $pinfo.CreateNoWindow  = $true

            $proc = New-Object System.Diagnostics.Process
            $proc.StartInfo = $pinfo

            $bag = [System.Collections.Concurrent.ConcurrentBag[string]]::new()

            $outEvt = Register-ObjectEvent -InputObject $proc -EventName OutputDataReceived -Action {
              if ($EventArgs.Data) {
                Write-Host "  [OUT] $($EventArgs.Data)"
                $Event.MessageData.Add($EventArgs.Data)
              }
            } -MessageData $bag
            $errEvt = Register-ObjectEvent -InputObject $proc -EventName ErrorDataReceived -Action {
              if ($EventArgs.Data) {
                Write-Host "  [ERR] $($EventArgs.Data)"
                $Event.MessageData.Add($EventArgs.Data)
              }
            } -MessageData $bag

            $proc.Start() | Out-Null
            $proc.BeginOutputReadLine()
            $proc.BeginErrorReadLine()

            # Cho 10 giay xem ket qua
            $elapsed = 0
            $portFailed = $false
            $portSuccess = $false

            while ($elapsed -lt 10) {
              Start-Sleep -Seconds 1
              $elapsed++

              foreach ($line in $bag) {
                if ($line -match "remote port forwarding failed") { $portFailed = $true }
                if ($line -match "Forwarding TCP connections from ([^\s]+)") {
                  $domain = $Matches[1]
                  $portSuccess = $true
                }
                if ($line -match "serveo\.net:(\d+)") {
                  $domain = "serveo.net:$($Matches[1])"
                  $portSuccess = $true
                }
              }

              if ($portFailed -or $portSuccess) { break }
            }

            # Huy event
            Unregister-Event -SourceIdentifier $outEvt.Name -ErrorAction SilentlyContinue
            Unregister-Event -SourceIdentifier $errEvt.Name -ErrorAction SilentlyContinue

            if ($portSuccess) {
              Write-Host "  ✅ THANH CONG! serveo.net:$port" -ForegroundColor Green
              $successPort = $port
              break
            } elseif ($portFailed) {
              Write-Host "  ❌ Port $port bi chiem, thu port tiep theo..." -ForegroundColor Yellow
              Stop-Process -Name "ssh" -Force -ErrorAction SilentlyContinue
            } else {
              # Khong biet - co the dang chay nhung chua in domain
              # Dung thuyet phuc: neu ket noi thanh cong thi SSH van chay
              if (!$proc.HasExited) {
                Write-Host "  ⚠️ Khong thay phan hoi ro rang, co the tunnel dang hoat dong." -ForegroundColor Yellow
                Write-Host "  Gia su serveo.net:$port" -ForegroundColor Yellow
                $domain = "serveo.net:$port"
                $successPort = $port
                break
              }
              Write-Host "  ❌ SSH thoat som, thu port tiep theo..." -ForegroundColor Yellow
            }
          }

          if ($domain -ne "") {
            Write-Host ""
            Write-Host "====================================" -ForegroundColor Green
            Write-Host "✅ SERVEO DOMAIN: $domain" -ForegroundColor Green
            Write-Host "====================================" -ForegroundColor Green
            echo "SERVEO_DOMAIN=$domain" >> $env:GITHUB_ENV
          } else {
            Write-Host ""
            Write-Host "❌ Tat ca cac port deu that bai!" -ForegroundColor Red
            Write-Host "ℹ️  Serveo co the yeu cau SSH key de dung TCP tunnel." -ForegroundColor Yellow
            Write-Host "ℹ️  Xem them: https://serveo.net/#tips" -ForegroundColor Yellow
            echo "SERVEO_DOMAIN=UNKNOWN" >> $env:GITHUB_ENV
          }

      - name: 🎉 THÔNG TIN KẾT NỐI
        run: |
          $domain = $env:SERVEO_DOMAIN
          $durationInput = "${{ github.event.inputs.duration }}"
          switch ($durationInput) {
            "1h"    { $totalMinutes = 60;  $displayTime = "1 gio" }
            "3h"    { $totalMinutes = 180; $displayTime = "3 gio" }
            "5h40m" { $totalMinutes = 340; $displayTime = "5 gio 40 phut" }
          }
          $tz      = [System.TimeZoneInfo]::FindSystemTimeZoneById("SE Asia Standard Time")
          $endTime = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $tz).AddMinutes($totalMinutes)

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║  RDP FREE - SERVEO TUNNEL                    ║" -ForegroundColor Cyan
          Write-Host "╠══════════════════════════════════════════════╣" -ForegroundColor Cyan
          Write-Host "║  🌐 HOST : $domain" -ForegroundColor Yellow
          Write-Host "║  👤 User : Administrator" -ForegroundColor White
          Write-Host "║  ⏱️  Time : $displayTime" -ForegroundColor White
          Write-Host "║  🕐  End  : $($endTime.ToString('HH:mm:ss')) (VN)" -ForegroundColor White
          Write-Host "╚══════════════════════════════════════════════╝" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "📌 Ket noi RDP: Mo mstsc -> Nhap '$domain'" -ForegroundColor Green

          echo "TOTAL_MINUTES=$totalMinutes" >> $env:GITHUB_ENV

      - name: ⏳ DUY TRÌ RDP
        run: |
          $totalMinutes = $env:TOTAL_MINUTES
          $tz = [System.TimeZoneInfo]::FindSystemTimeZoneById("SE Asia Standard Time")
          $endTime = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $tz).AddMinutes($totalMinutes)
          $frames = @('⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏')
          $startTime = Get-Date
          do {
            $now = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $tz)
            $remaining = $endTime - $now
            if ($remaining.TotalSeconds -le 0) { break }
            $h = [int][math]::Floor($remaining.TotalHours)
            $m = [int][math]::Floor($remaining.TotalMinutes % 60)
            $s = [int][math]::Floor($remaining.TotalSeconds % 60)
            $f = $frames[([int]((Get-Date)-$startTime).TotalSeconds) % $frames.Length]
            Write-Host "`r$f Con lai: ${h}:$('{0:d2}' -f $m):$('{0:d2}' -f $s)" -NoNewline -ForegroundColor Cyan
            Start-Sleep -Seconds 5
          } while ($true)
          Write-Host ""
          Write-Host "Het thoi gian" -ForegroundColor Red

      - name: 🧹 DỌN DẸP
        if: always()
        run: |
          Stop-Process -Name "ssh" -Force -ErrorAction SilentlyContinue
          Write-Host "✅ Done"
